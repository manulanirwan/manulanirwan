<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Manula Nirwan profile banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B12"/>
      <stop offset="55%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#071018"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00FF66" stop-opacity="0"/>
      <stop offset="40%" stop-color="#00FF66"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00FF66"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#102033" stroke-width="1"/>
    </pattern>
    <filter id="soft">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)" opacity="0.45"/>

  <circle cx="1080" cy="80" r="120" fill="#00FF66" opacity="0.05" filter="url(#soft)"/>
  <circle cx="180" cy="300" r="90" fill="#3B82F6" opacity="0.06" filter="url(#soft)"/>

  <rect x="48" y="36" width="1184" height="288" rx="22" fill="#0A111B" stroke="#163024" stroke-width="1.5"/>
  <rect x="48" y="36" width="8" height="288" rx="4" fill="url(#glow)"/>

  <text x="88" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#3DDC84" letter-spacing="2">PROFILE // PUBLIC NODE</text>
  <text x="88" y="162" font-family="ui-sans-serif, Inter, Segoe UI, Arial" font-size="54" font-weight="700" fill="#F3F6FB">MANULA NIRWAN</text>
  <text x="88" y="208" font-family="ui-sans-serif, Inter, Segoe UI, Arial" font-size="22" fill="#9FB0C3">Cybersecurity Student  ·  Web Developer  ·  AI Builder</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
    <rect x="88" y="236" width="168" height="34" rx="8" fill="#10261A" stroke="#1F6A40"/>
    <text x="108" y="258" fill="#00FF66">STATUS: ONLINE</text>
    <rect x="268" y="236" width="188" height="34" rx="8" fill="#101824" stroke="#27425E"/>
    <text x="288" y="258" fill="#7DD3FC">ACCESS: STUDENT</text>
    <rect x="468" y="236" width="188" height="34" rx="8" fill="#101824" stroke="#27425E"/>
    <text x="488" y="258" fill="#C9D1D9">LOC: SRI LANKA</text>
  </g>

  <path d="M88 300 H720" stroke="url(#line)" stroke-width="2"/>
</svg>
